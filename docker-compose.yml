# Stack SaaS: PostgreSQL + backend (escalável) + frontend
# Subir:            docker compose up --build
# Escalar backend:  docker compose up --scale backend=3
#
# Em produção, coloque um proxy/balanceador (nginx/traefik) na frente do
# serviço "backend" para distribuir entre as réplicas.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica}
      POSTGRES_DB: ${POSTGRES_DB:-clinica}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # host 5433 (evita conflito com Postgres local na 5432); interno continua 5432
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinica}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-clinica}:${POSTGRES_PASSWORD:-clinica}@db:5432/${POSTGRES_DB:-clinica}
      JWT_SECRET: ${JWT_SECRET:-troque-em-producao-por-um-segredo-forte}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090,http://localhost:8080,http://localhost:5173}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      # host configurável (8080 costuma estar ocupada); container = 80
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
